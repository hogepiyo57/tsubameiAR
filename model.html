<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>つばめい 3Dモデル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: #cfd8e0; }
  #view { position: fixed; inset: 0; touch-action: none; }
  .bar { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0 12px; }
  .bar .btn { font-size: 15px; min-height: 40px; padding: 6px 12px; }
  .back { position: fixed; left: 12px; top: calc(10px + env(safe-area-inset-top)); min-height: 36px; font-size: 14px; }
  .info { position: fixed; right: 12px; top: calc(10px + env(safe-area-inset-top)); font-size: 13px; padding: 8px 12px; border-radius: 12px; background: rgba(255, 255, 255, .85); line-height: 1.6; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<a class="btn back" href="index.html">◀ もどる</a>
<div class="info">ドラッグで回転・ピンチ／ホイールで拡大<br><span id="ver"></span></div>
<div class="bar" id="bar">
  <button class="btn" type="button" data-pose="auto" aria-pressed="true">じどう</button>
  <button class="btn" type="button" data-pose="stand">立つ</button>
  <button class="btn" type="button" data-pose="wave">手をふる</button>
  <button class="btn" type="button" data-pose="banzai">ばんざい</button>
  <button class="btn" type="button" data-pose="shy">てれる</button>
  <button class="btn" type="button" data-pose="fly">とぶ</button>
</div>
<script type="module">
// つばめいの3Dモデルを回して見る確認用ページ（係用）
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createTsubamei } from './js/models/tsubamei.js';

const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfd8e0);
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
camera.position.set(0.9, 1.0, 3.2);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.62, 0);
controls.enableDamping = true;
controls.minDistance = 1;
controls.maxDistance = 8;
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a90, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(-1, 2, 3);
scene.add(sun);

// 床と1.2mの目盛り
const floor = new THREE.Mesh(new THREE.CircleGeometry(2, 48), new THREE.MeshBasicMaterial({ color: 0xb8c4cc }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
const ruler = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-0.75, 0, 0), new THREE.Vector3(-0.75, 1.2, 0), new THREE.Vector3(-0.68, 1.2, 0)]),
  new THREE.LineBasicMaterial({ color: 0x555566 })
);
scene.add(ruler);

const chara = createTsubamei();
scene.add(chara);
chara.userData.appear();
chara.userData.ready.then(() => { document.getElementById('ver').textContent = `モデル v${chara.userData.version}`; });

// ポーズ：「じどう」は一定の間隔で切りかわる。ほかは押したポーズで止める
document.getElementById('bar').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  document.querySelectorAll('#bar button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  if (b.dataset.pose === 'auto') chara.userData.setAuto();
  else chara.userData.holdPose(b.dataset.pose);
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.1, clock.getDelta());
  chara.userData.update(dt);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
