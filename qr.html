<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>つばめいAR QRコード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  body { padding: 16px; }
  .wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 16px; }
  .setup { background: #fff; border-radius: 16px; padding: 16px; }
  .setup h1 { margin: 0 0 8px; font-size: 20px; color: var(--purple-dark); }
  .setup label { display: block; font-size: 14px; }
  .setup input { display: block; width: 100%; margin-top: 4px; padding: 8px; font: inherit; border: 2px solid #d9cfe0; border-radius: 8px; }
  .setup p { margin: 12px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .card-qr { background: #fff; border: 3px solid var(--purple); border-radius: 16px; padding: 16px; text-align: center; break-inside: avoid; }
  .card-qr img { width: 72px; }
  .card-qr h2 { margin: 4px 0 2px; font-size: 22px; color: var(--purple-dark); }
  .card-qr .lead { margin: 0 0 6px; font-size: 14px; }
  .card-qr svg { width: 100%; max-width: 260px; height: auto; }
  .card-qr .url { margin: 6px 0 0; font-size: 11px; word-break: break-all; color: #777; }
  @media print {
    body { background: #fff; padding: 0; }
    .no-print { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="setup no-print">
    <h1>入口に貼るQRコード</h1>
    <label>サイトのURL（GitHub Pages のURL。ふつうは自動で入ります）
      <input type="text" id="base">
    </label>
    <p>
      <button class="btn primary" type="button" onclick="print()">印刷する</button>
      <a class="btn" href="index.html">カメラ画面</a>
      <a class="btn" href="model.html">3Dモデルを見る</a>
    </p>
  </div>
  <div class="cards" id="cards"></div>
</div>
<script>
  // 来場者用（自撮り＝インカメラ）と、係が撮る用（アウトカメラ）
  const pages = [
    ['つばめいと しゃしん', 'スマホで よみとってね（じどりモード）', '?camera=user'],
    ['つばめいと しゃしん', '係の人が とるとき（アウトカメラ）', '?camera=environment'],
  ];
  const base = document.getElementById('base');
  base.value = location.href.replace(/qr\.html.*$/, '');
  function draw() {
    const root = base.value.trim().replace(/\/?$/, '/');
    document.getElementById('cards').innerHTML = pages.map(([title, lead, query]) => {
      const url = root + query;
      const qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      return `<div class="card-qr"><img src="assets/icon.png" alt=""><h2>${title}</h2><p class="lead">${lead}</p>`
        + `${qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true })}<p class="url">${url}</p></div>`;
    }).join('');
  }
  base.addEventListener('input', draw);
  draw();
</script>
</body>
</html>
